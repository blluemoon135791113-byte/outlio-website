# The real scheduler — R10.
#
# WHY THIS EXISTS AND NOT vercel.json
#
# Vercel's Hobby plan allows ONE cron invocation per DAY. For a product whose
# send worker paces email through a ramp and a sending window, one tick a day
# means a campaign takes weeks to go out and a reply is noticed tomorrow. That
# is not a slower product, it is a broken one.
#
# GitHub Actions runs a schedule on the free tier, and the repository is
# already here. All it does is make one authenticated request; every decision
# and all the work stays in the app.
#
# ⚠️ THIS IS NO LONGER THE PRIMARY SCHEDULER. It is a backstop.
#
# The paragraph above was written expecting GitHub to be late "by several
# minutes". It was wrong by two orders of magnitude. Measured over 19
# consecutive scheduled runs in September 2026, the gaps were:
#
#   130, 170, 203, 242, 274, 113, 100, 134, 148, 208,
#   258, 265, 271, 108, 146, 152, 221, 252, 279   (minutes)
#
# An average of 193 minutes for a job that asks for 5. Not once did it run at
# anything close to the requested interval -- GitHub deprioritises scheduled
# workflows on free tiers and drops them under load. At ~7 ticks a day and 25
# emails a tick, that capped the platform at ~185 emails a day in total.
#
# The real schedule now lives in the database: supabase/migrations/
# 0118_pg_cron_tick.sql, pg_cron every 5 minutes. This file is kept because
# redundancy in a scheduler is worth having and these runs are free -- if
# pg_cron stops, GitHub still delivers something, and the admin panel's
# staleness check reports whichever one is actually arriving.
#
# The tick is idempotent and claim-based, so two schedulers overlapping is
# safe: the second one finds the work already claimed.
name: Background tick

on:
  schedule:
    # Every 5 minutes. GitHub treats this as a floor, not a guarantee.
    - cron: '*/5 * * * *'
  # So it can be triggered by hand while debugging, without waiting.
  workflow_dispatch:

# A slow tick must not stack up behind itself. The claim queues make overlap
# safe, but there is no reason to pay for it.
concurrency:
  group: background-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://app.outlio.io' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository's secrets."
            echo "The endpoint fails closed, so every request would be refused."
            exit 1
          fi

          # --fail-with-body so a non-2xx fails the job AND shows why.
          # ⚠️ The secret goes in a HEADER, never a query string: URLs are
          # logged by proxies and by GitHub itself.
          curl --silent --show-error --fail-with-body \
               --max-time 120 \
               --header "Authorization: Bearer $CRON_SECRET" \
               "$APP_URL/api/cron"

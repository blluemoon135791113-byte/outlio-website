use_default_settings: true

# The MCP calls the private JSON endpoint. HTML remains enabled for local
# diagnostics at http://localhost:8080; neither port is exposed publicly.
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false

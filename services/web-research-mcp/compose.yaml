services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: web_research
      POSTGRES_USER: web_research
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - web-research-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_research -d web_research"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: .
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://web_research:local-development-only@postgres:5432/web_research
      DATABASE_SSL_MODE: disable
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN to at least 24 characters}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web-research-postgres:
